# Compila o agente e gera o instalador do Windows.
#
# Builds de branch/execução manual são artefatos de TESTE. Somente uma release
# publicada com tag SemVer gera o instalador oficial anexado à release.
name: Agente Windows

on:
  push:
    branches: [main]
    paths: ['apps/agent/**', '.github/workflows/agente.yml']
  # Publicar uma release anexa o instalador nela. Não dá para usar `tags`
  # junto de `paths` aqui: o filtro de caminho valeria para a tag também, e
  # uma tag em commit que não toca o agente não geraria instalador nenhum.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/agent/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: go vet ./...
      - run: go test ./...

  instalador:
    needs: testar
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/agent
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/agent/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Versão
        id: versao
        env:
          EVENTO: ${{ github.event_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          PRE_RELEASE: ${{ github.event.release.prerelease }}
          NUMERO_EXECUCAO: ${{ github.run_number }}
          TENTATIVA: ${{ github.run_attempt }}
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION deve conter uma versão estável X.Y.Z; encontrado: $base"
          }

          if ($env:EVENTO -eq 'release') {
            if ($env:PRE_RELEASE -eq 'True') {
              throw 'Releases de teste/pré-lançamento não geram instaladores oficiais. Use o artefato TESTE do workflow.'
            }
            if ($env:TAG_RELEASE -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release oficial exige tag vX.Y.Z; encontrado: $env:TAG_RELEASE"
            }
            if ($env:TAG_RELEASE -ne "v$base") {
              throw "A tag $env:TAG_RELEASE não corresponde a apps/agent/VERSION ($base). Atualize VERSION antes de publicar."
            }
            $versao = $env:TAG_RELEASE.Substring(1)
            $canal = 'OFICIAL'
          } else {
            $sha = (git rev-parse --short=7 HEAD).Trim()
            $versao = "$base-dev.$($env:NUMERO_EXECUCAO).$($env:TENTATIVA).$sha"
            $canal = 'TESTE'
          }

          "versao=$versao" >> $env:GITHUB_OUTPUT
          "canal=$canal" >> $env:GITHUB_OUTPUT

      # Sem -s -w de propósito: binário com símbolos dispara bem menos falso
      # positivo no Defender/SmartScreen (mesma razão do Makefile).
      - name: Carimbar versão nos recursos do Windows
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $base = ($env:VERSAO -split '-', 2)[0]
          $partes = $base.Split('.')
          $infoPath = 'cmd/agent/versioninfo.json'
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json -AsHashtable
          $info.FixedFileInfo.FileVersion.Major = [int]$partes[0]
          $info.FixedFileInfo.FileVersion.Minor = [int]$partes[1]
          $info.FixedFileInfo.FileVersion.Patch = [int]$partes[2]
          $info.FixedFileInfo.ProductVersion.Major = [int]$partes[0]
          $info.FixedFileInfo.ProductVersion.Minor = [int]$partes[1]
          $info.FixedFileInfo.ProductVersion.Patch = [int]$partes[2]
          $info.StringFileInfo.FileVersion = $env:VERSAO
          $info.StringFileInfo.ProductVersion = $env:VERSAO
          $info | ConvertTo-Json -Depth 8 | Set-Content -Path $infoPath -Encoding utf8NoBOM

      - name: Gerar recursos do Windows
        run: |
          Push-Location cmd/agent
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o resource_windows_amd64.syso versioninfo.json
          Pop-Location

      - name: Compilar o núcleo do agente
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags "-H=windowsgui -X main.Versao=${{ steps.versao.outputs.versao }}" -o bin/notifica-core.exe ./cmd/agent

      - name: Compilar a Central do Agente
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $base = ($env:VERSAO -split '-', 2)[0]
          $fileVersion = "$base.0"
          dotnet publish gui\ConectaNotificaAgente.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=$env:VERSAO -p:InformationalVersion=$env:VERSAO `
            -p:AssemblyVersion=$fileVersion -p:FileVersion=$fileVersion -o bin\gui-publish
          Copy-Item bin\gui-publish\ConectaNotificaAgente.exe bin\ConectaNotificaAgente.exe

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DVersao=${{ steps.versao.outputs.versao }} `
            instalador\conecta-notifica.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ConectaNotifica-Agente-${{ steps.versao.outputs.canal }}-${{ steps.versao.outputs.versao }}
          path: apps/agent/dist/*.exe
          if-no-files-found: error

      - name: Anexar à release
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: apps/agent/dist/*.exe
