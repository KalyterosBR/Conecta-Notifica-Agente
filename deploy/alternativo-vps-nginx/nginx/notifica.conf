# Conecta Notifica — painel na raiz, API sob /api.
#   /              -> Next.js  (127.0.0.1:3000)
#   /api/v1/...    -> NestJS   (127.0.0.1:3001/v1/...)
#
# Arquivo em HTTP: o certbot --nginx clona este bloco para o 443 com o
# certificado e deixa o 80 redirecionando. Não escreva SSL aqui à mão.
server {
    listen 80;
    listen [::]:80;
    server_name notifica.conectapontoeacesso.com.br;

    access_log /var/log/nginx/notifica-access.log;
    error_log  /var/log/nginx/notifica-error.log;

    # Lote do agente: 200 eventos cabem folgados; a API já limita em 1 MB.
    client_max_body_size 2m;

    # API do agente, do painel e webhooks da UAZAPI.
    # A barra final do proxy_pass é o que corta o prefixo /api — não remova.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agente offline reenvia sozinho; não vale segurar conexão pendurada.
        proxy_read_timeout 60s;
    }

    # Painel (Next.js).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
