# Conecta Notifica na VPS, atrás do Traefik que já roda na máquina.
#
#   cd /opt/conecta-notifica
#   cp deploy/producao.env.example deploy/producao.env   # e preencha
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/producao.env up -d --build
#
# Não subimos proxy nenhum: as portas 80/443 são do Traefik do Docker Manager
# da Hostinger, que também serve o n8n. Ele descobre nossos contêineres pelas
# labels abaixo (exposedbydefault=false) e emite o certificado pelo resolver
# `letsencrypt` — para isso o DNS do domínio precisa apontar para esta VPS.
#
# O Postgres é externo (Neon), apontado por DATABASE_URL no producao.env.
name: conecta-notifica

networks:
  # Rede privada do projeto: redis, api, worker e web conversam por aqui.
  interna:
  # Rede onde o Traefik está: só quem recebe tráfego HTTP entra nela.
  publica:
    external: true
    name: ${REDE_TRAEFIK:?defina no producao.env}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    networks: [interna, publica]
    environment:
      # Banco externo — inclua ?sslmode=require quando o servidor aceitar TLS.
      DATABASE_URL: ${DATABASE_URL:?defina no producao.env}
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?defina no producao.env}
      CORS_ORIGIN: https://${DOMINIO},https://${DOMINIO_VPS}
      # Vazio de propósito: o Traefik remove o /api antes de repassar.
      API_PREFIX: ""
      # Conta UAZAPI do SaaS: é ela que cria a instância de cada escola quando
      # a direção conecta o WhatsApp pelo QR code no painel.
      UAZAPI_URL: ${UAZAPI_URL:-}
      UAZAPI_ADMIN_TOKEN: ${UAZAPI_ADMIN_TOKEN:-}
      # Endereço público da API — vai no webhook que a UAZAPI chama de volta.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://${DOMINIO_VPS}/api}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${REDE_TRAEFIK}
      # Regra mais longa que a do painel, então o Traefik casa esta primeiro.
      traefik.http.routers.notifica-api.rule: Host(`${DOMINIO}`) && PathPrefix(`/api`)
      traefik.http.routers.notifica-api.entrypoints: websecure
      traefik.http.routers.notifica-api.tls.certresolver: letsencrypt
      traefik.http.routers.notifica-api.middlewares: notifica-api-strip
      traefik.http.middlewares.notifica-api-strip.stripprefix.prefixes: /api
      traefik.http.services.notifica-api.loadbalancer.server.port: "3001"
      # Mesmo serviço no hostname da VPS — roteador separado para que uma falha
      # de certificado no domínio próprio não derrube o outro.
      traefik.http.routers.notifica-api-vps.rule: Host(`${DOMINIO_VPS}`) && PathPrefix(`/api`)
      traefik.http.routers.notifica-api-vps.entrypoints: websecure
      traefik.http.routers.notifica-api-vps.tls.certresolver: letsencrypt
      traefik.http.routers.notifica-api-vps.middlewares: notifica-api-strip
      traefik.http.routers.notifica-api-vps.service: notifica-api

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    networks: [interna]
    # Mesma imagem da api; só o comando muda. As migrations quem aplica é a
    # api, então aqui é só o worker.
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Alerta de agente mudo: o worker varre e manda o JSON para este webhook
      # (o n8n da própria VPS serve). Sem a variável, fica só no log.
      ALERTAS_WEBHOOK_URL: ${ALERTAS_WEBHOOK_URL:-}
      ALERTA_AGENTE_MINUTOS: ${ALERTA_AGENTE_MINUTOS:-20}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Caminho relativo: painel e API no mesmo domínio, sem CORS.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    networks: [interna, publica]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${REDE_TRAEFIK}
      traefik.http.routers.notifica-web.rule: Host(`${DOMINIO}`)
      traefik.http.routers.notifica-web.entrypoints: websecure
      traefik.http.routers.notifica-web.tls.certresolver: letsencrypt
      traefik.http.services.notifica-web.loadbalancer.server.port: "3000"
      traefik.http.routers.notifica-web-vps.rule: Host(`${DOMINIO_VPS}`)
      traefik.http.routers.notifica-web-vps.entrypoints: websecure
      traefik.http.routers.notifica-web-vps.tls.certresolver: letsencrypt
      traefik.http.routers.notifica-web-vps.service: notifica-web

volumes:
  redisdata:
